<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf1f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1217" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מרכז שליטה">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>גרינפלסטש מרכז שליטה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&family=Secular+One&display=swap">
<style>
/* Layout: instrument-panel feed from the radar app – sticky header, one column of cards, fixed bottom tab bar, full-screen sheets for detail and forms */
:root {
  --bg: #edf1f3; --surface: #ffffff; --surface-2: #e2e8ec; --ink: #13202a; --ink-2: #44535f; --muted: #687884;
  --line: #d4dce2; --accent: #0d6b83; --accent-ink: #ffffff; --accent-soft: #d5eaf0;
  --good: #157847; --good-soft: #dcf0e5; --bad: #bb3829; --bad-soft: #f7dfdb; --warn: #9c5a00; --warn-soft: #f5e7d0;
  --shadow: 0 1px 2px rgba(19,32,42,.06), 0 2px 8px rgba(19,32,42,.05); --scrim: rgba(11,18,23,.45);
  --font-display: "Secular One", "Assistant", system-ui, sans-serif;
  --font-body: "Assistant", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 14px; --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1217; --surface: #131d24; --surface-2: #1c2830; --ink: #e3ebf0; --ink-2: #b3c0ca; --muted: #8496a3;
    --line: #24323c; --accent: #4bb7d3; --accent-ink: #05222b; --accent-soft: #11313b; --good: #44c486;
    --good-soft: #10331f; --bad: #ff7a69; --bad-soft: #3a1914; --warn: #f1a94a; --warn-soft: #382811;
    --shadow: none; --scrim: rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1217; --surface: #131d24; --surface-2: #1c2830; --ink: #e3ebf0; --ink-2: #b3c0ca; --muted: #8496a3;
  --line: #24323c; --accent: #4bb7d3; --accent-ink: #05222b; --accent-soft: #11313b; --good: #44c486;
  --good-soft: #10331f; --bad: #ff7a69; --bad-soft: #3a1914; --warn: #f1a94a; --warn-soft: #382811;
  --shadow: none; --scrim: rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 700; }
.num { direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.mono { font-family: var(--font-data); direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.brand h1 { font: 21px/1.1 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .sub { font-size: 12px; color: var(--muted); display: block; font-weight: 600; letter-spacing: .04em; }
.mark { width: 30px; height: 30px; flex: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }

main { padding-block: 14px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 84px); touch-action: pan-y; }
html, body { overflow-x: hidden; overflow-x: clip; max-width: 100%; }
.pager { display: flex; justify-content: center; gap: 6px; padding-top: 2px; }
.pager i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); transition: width .2s, background-color .2s; }
.pager i.on { width: 18px; border-radius: 3px; background: var(--accent); }
@media (prefers-reduced-motion: reduce) { .pager i { transition: none; } }
.stack { display: flex; flex-direction: column; gap: 12px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 10px; }
.section-title h2 { font: 19px/1.25 var(--font-display); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }

/* hero */
.hero { display: flex; gap: 16px; align-items: center; }
.hero .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.big { font: 34px/1.05 var(--font-display); }
.ring { position: relative; width: 84px; height: 84px; flex: none; }
.ring svg { width: 84px; height: 84px; transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; font: 22px/1 var(--font-display); }
.ring .cap { position: absolute; inset-inline: 0; bottom: 17px; text-align: center; font-size: 10.5px; color: var(--muted); }

/* strip & chips */
.strip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; text-align: start; cursor: pointer; }
.stat .v { font: 20px/1.2 var(--font-display); }
.stat .l { font-size: 12.5px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; border-radius: 8px; padding: 3px 8px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; border: 0; }
.chip b { color: inherit; }
.chip.good { background: var(--good-soft); color: var(--good); } .chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.acc { background: var(--accent-soft); color: var(--accent); }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; white-space: nowrap; cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

/* rows */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 2px; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: start; cursor: pointer; }
.row:first-child { border-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row .t { font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .end { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
.row .amt { font-weight: 700; }
.stripe { width: 4px; align-self: stretch; border-radius: 4px; background: var(--line); flex: none; }
.stripe.bad { background: var(--bad); } .stripe.warn { background: var(--warn); } .stripe.good { background: var(--good); } .stripe.acc { background: var(--accent); }
.empty { text-align: center; padding: 22px 8px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; align-items: center; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: var(--ink); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.btn.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: 13.5px; border-radius: 10px; }
.btn svg { width: 18px; height: 18px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btns.full > * { flex: 1 1 0; }
.fab { position: fixed; z-index: 25; inset-inline-start: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 14px); height: 52px; border-radius: 16px; padding: 0 18px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.fab svg { width: 20px; height: 20px; }

/* banners */
.banner { border-radius: 12px; padding: 10px 12px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.banner .dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; flex: none; background: var(--accent); }
.banner.info { background: var(--accent-soft); } .banner.warn { background: var(--warn-soft); } .banner.bad { background: var(--bad-soft); }
.banner.warn .dot { background: var(--warn); } .banner.bad .dot { background: var(--bad); }
.banner .grow { flex: 1; min-width: 0; }

/* bottom nav */
.nav { position: fixed; inset-inline: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav-in { max-width: 680px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: var(--nav-h); }
.nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; min-width: 0; white-space: nowrap; color: var(--muted); cursor: pointer; position: relative; }
.nav button svg { width: 23px; height: 23px; }
.nav button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.nav .badge { position: absolute; top: 8px; inset-inline-end: calc(50% - 22px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--bad); color: var(--surface); font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }

/* full-screen sheet */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-top: env(safe-area-inset-top, 0px); }
.sheet-bar { position: sticky; top: 0; z-index: 2; background: var(--bg); background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.sheet-bar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.sheet-bar h2 { font: 19px/1.2 var(--font-display); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-body { padding-block: 16px calc(env(safe-area-inset-bottom, 0px) + 32px); display: flex; flex-direction: column; gap: 12px; }

/* forms */
.form { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.field input, .field select, .field textarea { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.field textarea { min-height: 76px; resize: vertical; }
.field .hint { font-size: 12.5px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.kv:first-child { border-top: 0; }
.kv span:first-child { color: var(--muted); }
.kv b { text-align: end; }
.total { font: 26px/1.1 var(--font-display); }
.item { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .grow { flex: 1; min-width: 0; }
.qty { display: flex; align-items: center; gap: 4px; flex: none; }
.qty input { width: 64px; text-align: center; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 4px; font-size: 16px; }
.x { width: 32px; height: 32px; border-radius: 9px; border: 0; background: var(--surface-2); cursor: pointer; display: grid; place-items: center; flex: none; color: var(--muted); }
.x svg { width: 16px; height: 16px; }
pre.out { white-space: pre-wrap; margin: 0; font: 14px/1.6 var(--font-body); background: var(--surface-2); border-radius: 10px; padding: 12px; max-height: 340px; overflow-y: auto; }
textarea.out { width: 100%; min-height: 180px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--surface); font-size: 13px; }

/* confirm dialog */
.scrim { position: fixed; inset: 0; z-index: 70; background: var(--scrim); display: grid; place-items: end center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.dialog { width: 100%; max-width: 480px; background: var(--surface); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.dialog h3 { font: 18px/1.3 var(--font-display); }
.toast { position: fixed; inset-inline: 16px; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px); z-index: 80; margin: 0 auto; max-width: 480px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 11px 14px; font-weight: 600; text-align: center; }

/* lock screen */
.lock { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding-block: 32px; text-align: center; }
.scope { position: relative; width: 220px; height: 128px; border-radius: 18px; border: 1.5px solid var(--accent); overflow: hidden; direction: ltr;
  background: repeating-linear-gradient(90deg, transparent 0 21px, color-mix(in srgb, var(--accent) 18%, transparent) 21px 22px), repeating-linear-gradient(0deg, transparent 0 21px, color-mix(in srgb, var(--accent) 18%, transparent) 21px 22px), var(--accent-soft); }
.scope .trace { position: absolute; top: 0; left: 0; width: 440px; height: 128px; animation: trace 1.6s linear infinite; }
.scope .trace path { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; }
.scope .bolt { position: absolute; inset: 0; display: grid; place-items: center; }
.scope .bolt svg { width: 46px; height: 46px; filter: drop-shadow(0 0 6px var(--bg)); }
.scope .read { position: absolute; bottom: 7px; left: 10px; font: 600 11px/1 var(--font-data); color: var(--accent); letter-spacing: .04em; }
.scope .live { position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--good); animation: live 1.6s ease-in-out infinite; }
@keyframes trace { to { transform: translateX(-110px); } }
@keyframes live { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .scope .trace, .scope .live { animation: none; } }
.lock h1 { font: 28px/1.15 var(--font-display); }
/* calendar questions */
.sched { display: flex; flex-direction: column; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.sched:first-child { border-top: 0; padding-top: 2px; }
.sched-h { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.sched-h b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sched-f { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 6px; }
.sched-f input, .sched-f select { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 6px; font-size: 15px; }
.cal-q { border-color: var(--accent); }
.cal-q .eyebrow { color: var(--accent); }
/* price list */
.pl-tools { display: flex; gap: 8px; }
.pl-tools input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.pl-cat { padding: 0; overflow: hidden; }
.pl-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
.pl-toggle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 0; background: none; text-align: start; cursor: pointer; padding: 0; color: var(--ink); }
.pl-toggle h3 { font: 17px/1.3 var(--font-display); }
.pl-toggle svg { width: 18px; height: 18px; color: var(--muted); transition: transform .15s; flex: none; }
.pl-cat.closed .pl-toggle svg { transform: rotate(90deg); }
.pl-add svg { width: 16px; height: 16px; vertical-align: -3px; }
.pl-cat.closed .pl-body { display: none; }
.pl-body { border-top: 1px solid var(--line); }
.pl-item { display: flex; gap: 10px; align-items: center; width: 100%; padding: 11px 14px; border: 0; border-top: 1px solid var(--line); background: none; text-align: start; cursor: pointer; color: var(--ink); }
.pl-item:first-child { border-top: 0; }
.pl-item .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pl-item .nm { font-weight: 700; }
.pl-item .meta { font-size: 12.5px; color: var(--muted); }
.pl-price { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
.pl-price .one { font-weight: 700; }
.pl-price .bulk { font-size: 12.5px; color: var(--accent); font-weight: 700; }
.pl-sub { padding: 9px 14px 7px; border-top: 1px solid var(--line); background: var(--surface-2); font-size: 13px; font-weight: 700; color: var(--ink-2); letter-spacing: .02em; }
.pl-body > .pl-sub:first-child { border-top: 0; }
.pl-add { width: 100%; border: 0; border-top: 1px dashed var(--line); background: none; color: var(--accent); font-weight: 700; padding: 11px 14px; text-align: start; cursor: pointer; }
.pl-sum { display: flex; flex-wrap: wrap; gap: 6px; }
.rng { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: end; }
.rng .dash { padding-bottom: 12px; color: var(--muted); }
.chk-l { display: flex; gap: 10px; align-items: center; font-weight: 700; cursor: pointer; }
.chk-l input { width: 20px; height: 20px; accent-color: var(--accent); }
/* pdf */
.pdf-pages { display: flex; flex-direction: column; gap: 10px; }
.pdf-pages img { width: 100%; height: auto; display: block; border-radius: 6px; border: 1px solid var(--line); background: #fff; }
.pdf-wait { text-align: center; padding: 40px 10px; color: var(--muted); font-weight: 700; }
/* voice recording */
.rec-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-block: 6px; }
.rec { width: 104px; height: 104px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-weight: 700; cursor: pointer; }
.rec svg { width: 32px; height: 32px; }
.rec .l { font-size: 12.5px; }
.rec.on { background: var(--bad); color: var(--surface); animation: recpulse 1.4s ease-out infinite; }
@keyframes recpulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--bad) 45%, transparent); } 100% { box-shadow: 0 0 0 18px transparent; } }
@media (prefers-reduced-motion: reduce) { .rec.on { animation: none; } }
.voice-cta { display: flex; gap: 12px; align-items: center; text-align: start; width: 100%; cursor: pointer; border: 1.5px dashed var(--accent); background: var(--accent-soft); color: var(--ink); border-radius: 14px; padding: 12px 14px; }
.voice-cta svg { width: 28px; height: 28px; color: var(--accent); flex: none; }
.voice-cta .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.kw { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.kw:first-child { border-top: 0; }
.kw b { flex: none; min-width: 92px; color: var(--accent); }
/* quote wizard */
.wiz-steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.seg { border: 0; background: none; padding: 4px 0; display: flex; flex-direction: column; gap: 5px; cursor: pointer; text-align: start; color: var(--muted); min-width: 0; }

const needsSched = (q) => !q.sched && q.status !== 'rejected' && qState(q) !== 'expired';
const ymd = (iso) => iso.replace(/-/g, '');
function calEvent(q) {
  const sc = q.sched, multi = sc.dur[0] === 'd', n = Number(sc.dur.slice(1)) || 1;
  const title = `${q.client} · ${q.location || ''} · הצעה ${q.no}`.replace(/ · $/, '');
  const c = client(q.client), lines = quoteModel(q).areas.flatMap((a) => [a.k, ...a.lines]);
  const details = [`הצעת מחיר ${q.no}`, c?.phone ? `טלפון: ${c.phone}` : '', `מחיר: ${ilsTxt(qSub(q))} ש"ח לפני מע"מ`, '', ...lines].filter((x, i) => x || i === 3).join('\n');
  let start, end;
  if (multi) { start = ymd(sc.date); end = ymd(addDays(sc.date, n)); }
  else { const [h, m] = (sc.time || '08:00').split(':').map(Number), mins = h * 60 + m + n * 60; start = `${ymd(sc.date)}T${pad(h)}${pad(m)}00`; end = `${ymd(addDays(sc.date, Math.floor(mins / 1440)))}T${pad(Math.floor(mins / 60) % 24)}${pad(mins % 60)}00`; }
  return { title, details, location: q.location || '', start, end, multi };
}
function calUrl(q) {
  const e = calEvent(q);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&ctz=Asia/Jerusalem' + `&text=${encodeURIComponent(e.title)}&dates=${e.start}/${e.end}&details=${encodeURIComponent(e.details)}&location=${encodeURIComponent(e.location)}`;
}
function calIcs(q) {
  const e = calEvent(q), esc2 = (t) => String(t).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, (m) => '\\' + m);
  const dt = (v) => (e.multi ? `;VALUE=DATE:${v}` : `;TZID=Asia/Jerusalem:${v}`);

}

function quoteModel(q) {
  const areas = [];
  (q.items || []).forEach((it) => {
    const key = it.area || 'כללי';
    let g = areas.find((x) => x.k === key); if (!g) { g = { k: key, lines: [] }; areas.push(g); }
    const n = num(it.qty);
    g.lines.push(`- ${it.name}${n > 1 ? ` (${n} ${it.unit || 'יח\''})` : ''}`);
  });
  const sp = q.supply || {};
  return {
    no: q.no, head: [`תאריך: ${fmtD(q.date)}`, `לכבוד: ${q.client}`, `מיקום: ${q.location || ''}`], areas,
    supply: [`- חומרים: ${sp.materials || ''}`, `- גופי תאורה: ${sp.lighting || ''}`, `- אביזרים: ${sp.accessories || ''}`],
    price: `${ilsTxt(qSub(q))} ש"ח`,

    sign: ['בברכה,', COMPANY, PHONE],
  };
}
function quoteText(q) {
  const m = quoteModel(q);
  return [
    `הצעת מחיר מס' ${m.no}`, ...m.head, '',
    'תיאור העבודה:', ...m.areas.flatMap((a, i) => [...(i ? [''] : []), a.k, ...a.lines]), '',
    'אספקה:', ...m.supply, '',
    `מחיר: ${m.price}`, '',
    'הערות:', ...m.notes, '',
    ...m.sign,
  ].join('\n');
}

const enc = new TextEncoder(), dec = new TextDecoder();

/* ---------- pattern pad: 3x3 dots, drawn with a finger ---------- */
function mountPattern(root, onDone) {
  const C = (i) => [50 + 100 * (i % 3), 50 + 100 * Math.floor(i / 3)];
  root.innerHTML = '<svg class="pat-lines" viewBox="0 0 300 300" aria-hidden="true"><polyline points=""></polyline><line x1="0" y1="0" x2="0" y2="0"></line></svg>'
    + Array.from({ length: 9 }, (_, i) => `<span class="pat-dot" style="left:${(C(i)[0] / 3).toFixed(2)}%;top:${(C(i)[1] / 3).toFixed(2)}%"></span>`).join('');
  root.setAttribute('role', 'application'); root.setAttribute('aria-label', 'משטח תבנית נעילה של 9 נקודות');
  const dots = [...root.querySelectorAll('.pat-dot')], poly = root.querySelector('polyline'), tail = root.querySelector('line');
  let seq = [], active = false, busy = false, timer;
  const pt = (e) => { const r = root.getBoundingClientRect(); return [(e.clientX - r.left) * 300 / r.width, (e.clientY - r.top) * 300 / r.height]; };
  const hit = (p) => { for (let i = 0; i < 9; i++) { const [x, y] = C(i); if (Math.hypot(p[0] - x, p[1] - y) < 34) return i; } return -1; };
  const add = (i) => {
    if (seq.includes(i)) return;
    const last = seq[seq.length - 1];
    if (last != null) { // passing straight over a dot connects it, like on a phone
      const ax = last % 3, ay = Math.floor(last / 3), bx = i % 3, by = Math.floor(i / 3);
      if ((ax + bx) % 2 === 0 && (ay + by) % 2 === 0) { const m = ((ay + by) / 2) * 3 + (ax + bx) / 2; if (!seq.includes(m)) seq.push(m); }
    }
    seq.push(i); try { navigator.vibrate?.(8); } catch {}
  };
  const draw = (p) => {
    poly.setAttribute('points', seq.map((i) => C(i).join(',')).join(' '));
    const [x, y] = seq.length ? C(seq[seq.length - 1]) : [0, 0];
    tail.setAttribute('x1', x); tail.setAttribute('y1', y);
    tail.setAttribute('x2', p && seq.length ? p[0] : x); tail.setAttribute('y2', p && seq.length ? p[1] : y);
    dots.forEach((d, i) => d.classList.toggle('on', seq.includes(i)));
  };
  const reset = () => { clearTimeout(timer); seq = []; root.classList.remove('bad', 'good', 'wait'); draw(); };
  root.addEventListener('pointerdown', (e) => {
    if (busy) return; e.preventDefault(); reset(); active = true;
    try { root.setPointerCapture(e.pointerId); } catch {}
    const p = pt(e), h = hit(p); if (h >= 0) add(h); draw(p);
  });
  root.addEventListener('pointermove', (e) => { if (!active) return; e.preventDefault(); const p = pt(e), h = hit(p); if (h >= 0) add(h); draw(p); });
  const end = () => { if (!active) return; active = false; draw(); if (seq.length) onDone(seq.slice(), api); };
  root.addEventListener('pointerup', end); root.addEventListener('pointercancel', end);
  const api = {
    reset,
    hold(kind) { busy = true; root.classList.add(kind); },
    release() { busy = false; root.classList.remove('wait', 'good'); },
    flash(kind, ms = 650) { busy = true; root.classList.remove('wait'); root.classList.add(kind); timer = setTimeout(() => { busy = false; reset(); }, ms); },
  };
  return api;
}

/* ---------- voice: keyword parser for a whole quote spoken in one go ---------- */
const HEB = '֐-׿';
const MARKS = [
  ['client', '', 'שם הלקוח|לכבוד|לקוח'],
  ['phone', 'ו?', 'מספר טלפון|מספר נייד|טלפון|פלאפון|נייד'],
  ['location', 'ו?ה?', 'מיקום העבודה|מיקום|כתובת'],
  ['area', 'ו?', 'סוג עבודה|אזור'],
  ['line', 'ו?', 'תיאור העבודה|תיאור|שורה'],
  ['all', 'ו?ה?', 'אספקה'],
  ['materials', 'ו?ה?', 'חומרים|חומר'],
  ['lighting', 'ו?', 'גופי התאורה|גופי תאורה'],
  ['accessories', 'ו?ה?', 'אביזרים|אביזר'],
  ['price', 'ו?ה?', 'סך הכל|סה"כ|סהכ|מחיר|בסך'],
  ['note', 'ו?ה?', 'הערות|הערה'],

const MARK_RE = MARKS.map(([f, pre, alts]) => [f, new RegExp(`(?<![${HEB}"])(?:${pre})(?:${alts})(?![${HEB}])`, 'g')]);

  return d.length === 10 ? `${d.slice(0, 3)}-${d.slice(3)}` : d.length === 9 ? `${d.slice(0, 2)}-${d.slice(2)}` : d;
}
function supplierOf(s) {
  const t = String(s);
  const hits = [
    [COMPANY, t.search(/עלינו|עליי|עלי(?![֐-׿])|אנחנו|אני(?![֐-׿])|שלנו|שלי(?![֐-׿])|גרינפלס|החברה|אצלנו/)],
    ['הלקוח', t.search(/לקוח|עליו|עליה(?![֐-׿])|עליהם|שלו(?![֐-׿])|שלה(?![֐-׿])|שלהם|הבעלים/)],
    ['לא רלוונטי', t.search(/לא רלוונטי|לא צריך|אין(?![֐-׿])|בלי(?![֐-׿])|ללא/)],

}

  if (m) return parseFloat(m[1]) * (m[2] ? 1000 : 1);
  if (/אלפיים/.test(t)) return 2000;
  if (/(?<![֐-׿])אלף(?![֐-׿])/.test(t)) return 1000;
  return 0;
}
function parseSpoken(text) {
  const src = String(text || '').replace(/\s+/g, ' ').trim();
  let hits = [];
  MARK_RE.forEach(([f, re]) => { re.lastIndex = 0; let m; while ((m = re.exec(src))) hits.push({ f, s: m.index, e: m.index + m[0].length }); });
  hits.sort((a, b) => a.s - b.s || b.e - a.e);
  hits = hits.filter((h, i, arr) => !arr.slice(0, i).some((o) => h.s < o.e));
  const out = { client: '', phone: '', location: '', areas: [], items: [], supply: {}, total: '', notes: [] };
  const lead = tidy(src.slice(0, hits.length ? hits[0].s : src.length));
  let area = '';
  const addLines = (seg) => seg.split(/[,.;\n]+|\sוגם\s|\sועוד\s/).map(tidy).filter(Boolean).forEach((name) => {
    const a = area || 'כללי'; if (!out.areas.includes(a)) out.areas.push(a);
    out.items.push({ area: a, name, qty: 1, unit: '', price: 0 });
  });
  hits.forEach((h, i) => {
    const seg = tidy(src.slice(h.e, i + 1 < hits.length ? hits[i + 1].s : src.length));
    if (!seg) return;
    switch (h.f) {
      case 'client': if (!out.client) out.client = tidy(seg.replace(PHONE_RE, '')); if (!out.phone) out.phone = phoneOf(seg); break;
      case 'phone': out.phone = phoneOf(seg) || out.phone; break;
      case 'location': if (!out.location) out.location = tidy(seg.replace(PHONE_RE, '')); break;
      case 'area': { const [name, ...rest] = seg.split(/[,.;\n]+/); area = tidy(name); if (area && !out.areas.includes(area)) out.areas.push(area); if (rest.length) addLines(rest.join(',')); break; }
      case 'line': addLines(seg); break;
      case 'all': { const v = supplierOf(seg); if (v) ['materials', 'lighting', 'accessories'].forEach((k) => { out.supply[k] = v; }); break; }
      case 'materials': case 'lighting': case 'accessories': { const v = supplierOf(seg); if (v) out.supply[h.f] = v; break; }
      case 'price': { const n = amountOf(seg); if (n) out.total = String(n); break; }
      case 'note': out.notes.push(seg); break;
    }
  });
  if (lead && !out.client) out.client = tidy(lead.replace(PHONE_RE, ''));
  if (!out.phone) out.phone = phoneOf(src);
  if (!out.total) { const m = src.match(/(\d[\d,]*(?:\.\d+)?)\s*(?:אלף\s*)?(?:שקלים|שקל|ש"ח|שח)/); if (m) out.total = String(amountOf(m[0])); }
  return out;
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recOn = false, recFinal = '', voiceText = '';
function updRecUI() {

function startRec() {

  rec.onresult = (e) => {

  };

  recOn = true;

}
function stopRec() { recOn = false; try { rec?.stop(); } catch {} updRecUI(); }
/* ---------- paste: a finished quote text (the WhatsApp version Claude writes) back into fields ---------- */
const WORK_RE = /^(תיאור|פירוט|תכולת|מהות)(\s|:|$)|^העבודה\s*:?$/;
const looksLikeQuote = (t) => /לכבוד/.test(t) && t.split('\n').some((l) => WORK_RE.test(l.replace(/[*_#]/g, '').trim()));
function parseQuoteText(text) {
  const lines = String(text).replace(/\r/g, '').split('\n').map((l) => l.trim().replace(/\*\*|__/g, '').replace(/^#+\s*/, '').replace(/^\*\s*/, '- ').trim());
  const out = { no: '', date: '', client: '', location: '', areas: [], items: [], supply: {}, total: '', notes: [] };
  const FIXED = [/אינו כולל מע"?מ/, /תוקף ההצעה/, /תקפה ל/];
  let sec = 'head', area = '', pendingArea = '', lastNote = null;
  const val = (l) => l.slice(l.indexOf(':') + 1).trim();
  const supKey = (l) => (/^-?\s*חומרים/.test(l) ? 'materials' : /^-?\s*גופי תאורה/.test(l) ? 'lighting' : /^-?\s*אביזרים/.test(l) ? 'accessories' : '');
  const toDate = (s) => { const m = s.match(/(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/); if (!m) return ''; const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad(m[2])}-${pad(m[1])}`; };
  const addItem = (name) => { const a = area || 'כללי'; if (!out.areas.includes(a)) out.areas.push(a); out.items.push({ area: a, name, qty: 1, unit: '', price: 0 }); };
  for (const l of lines) {
    if (!l) { if (sec === 'work' && pendingArea) { addItem(pendingArea); pendingArea = ''; } continue; }
    if (/^בברכה/.test(l)) break;
    if (/^הצעת מחיר/.test(l)) { const m = l.match(/(\d{3,})/); if (m) out.no = m[1]; continue; }
    if (/^תאריך\s*:/.test(l)) { out.date = toDate(val(l)); continue; }
    if (/^לכבוד\s*:/.test(l)) { out.client = val(l); continue; }
    if (/^(מיקום|מיקום העבודה|כתובת)\s*:/.test(l)) { out.location = val(l); continue; }
    if (WORK_RE.test(l)) { sec = 'work'; continue; }
    if (/^(נושא|שם חברה|טלפון|קבלן מבצע)\s*:/.test(l)) continue;
    if (/^אספקה/.test(l)) { if (pendingArea) { addItem(pendingArea); pendingArea = ''; } sec = 'supply'; continue; }
    if (/^(מחיר|סה"כ|עלות|סכום העבודה)/.test(l)) { if (pendingArea) { addItem(pendingArea); pendingArea = ''; } sec = 'price'; const n = val(l).replace(/,/g, '').match(/\d+(\.\d+)?/); if (n) out.total = n[0]; continue; }
    if (/^הערות/.test(l)) { sec = 'notes'; continue; }
    if (sec === 'work') {
      if (/^[-•*◦●▪]/.test(l)) { if (pendingArea) { area = pendingArea; pendingArea = ''; } addItem(l.replace(/^[-•*◦●▪]\s*/, '')); }
      else if (/:$/.test(l)) { if (pendingArea) addItem(pendingArea); pendingArea = ''; area = l.replace(/:$/, '').trim(); }
      else { if (pendingArea) addItem(pendingArea); pendingArea = l; }
    } else if (sec === 'supply') {
      const k = supKey(l); if (k) out.supply[k] = val(l); else out.notes.push(l.replace(/^[-•]\s*/, ''));
    } else if (sec === 'price') {
      if (!out.total) { const n = l.replace(/,/g, '').match(/\d+(\.\d+)?/); if (n) out.total = n[0]; }
    } else if (sec === 'notes') {
      const bullet = /^[-•*◦●▪]/.test(l), t = l.replace(/^[-•*◦●▪]\s*/, '');
      if (!bullet && lastNote != null) { if (lastNote >= 0) out.notes[lastNote] += ' ' + t; continue; }
      if (FIXED.some((r) => r.test(t))) { lastNote = -1; continue; }
      out.notes.push(t); lastNote = out.notes.length - 1;
    }
  }

  const allNotes = out.notes.join(' ');
  if (!out.supply.materials && /כולל[^.]*(חומרים|אביזרים)/.test(allNotes) && !/אינו כולל[^.]*(חומרים|אביזרים)/.test(allNotes)) { out.supply.materials = COMPANY; out.supply.accessories = out.supply.accessories || COMPANY; }

  return out;
}

/* ---------- render ---------- */
function render() {
  if (!db) return renderLock();
  const late = db.debts.filter((d) => dState(d) === 'late').length;
  const follow = db.quotes.filter((q) => qState(q) === 'follow').length;
  const body = { home: viewHome, debts: viewDebts, quotes: viewQuotes, prices: viewPrices, jobs: viewJobs, more: viewMore }[tab]();
  const navs = [['home', 'בית', 'home', 0], ['debts', 'גבייה', 'coin', late], ['quotes', 'הצעות', 'doc', follow], ['prices', 'מחירון', 'tag', 0], ['jobs', 'עבודות', 'tool', 0], ['more', 'לקוחות', 'users', 0]];
  const y = scrollY;
  $app.innerHTML = `<header class="topbar"><div class="wrap"><div class="brand">${MARK}<div style="min-width:0"><h1>מרכז שליטה</h1><span class="sub">${demoMode ? 'הדגמה · ' : ''}${COMPANY}</span></div></div><button class="icon-btn" data-act="lock" aria-label="נעילה">${ic('lock')}</button></div><div class="pager" aria-hidden="true">${TABS.map((k) => `<i class="${k === tab ? 'on' : ''}"></i>`).join('')}</div></header>
  <main class="wrap stack">${body}</main>
  <nav class="nav" aria-label="ניווט"><div class="nav-in">${navs.map(([k, l, i, b]) => `<button data-tab="${k}" ${tab === k ? 'aria-current="page"' : ''}>${ic(i)}<span>${l}</span>${b ? `<span class="badge num">${b}</span>` : ''}</button>`).join('')}</div></nav>
  ${sheet ? SHEETS[sheet.name](sheet.id) : ''}`;
  if (sheet) { const sh = $app.querySelector('.sheet'); if (sheet.y) sh.scrollTop = sheet.y; } else scrollTo(0, y);
  if (sheet?.name === 'pattern') mountChange();
  document.body.style.overflow = sheet ? 'hidden' : '';
  if (sheet?.name === 'pdf' && !(pdfState && pdfState.id === sheet.id)) {
    const q = db.quotes.find((x) => x.id === sheet.id), want = sheet.id; dropPdf(); pdfState = { id: want };
    if (q) buildPdf(q).then((r) => { if (pdfState?.id === want) { pdfState = r; if (sheet?.name === 'pdf') rerenderSheet(); } }).catch(() => { pdfState = null; toast('יצירת ה־PDF נכשלה'); });
  }
  if (focusAfter) { $app.querySelector(focusAfter)?.focus(); focusAfter = null; }
}
function openSheet(name, id) { draft = null; if (name === 'pdf') dropPdf(); if (name === 'quoteForm') wiz = id ? 4 : 0; if (name === 'pattern') chg = { step: MODE === 'pattern' ? 'current' : 'new', first: null }; sheet = { name, id, back: sheet }; render(); $app.querySelector('.sheet')?.scrollTo(0, 0); }
function closeSheet() { if (sheet?.name === 'voice') { stopRec(); voiceText = $app.querySelector('#v-text')?.value || voiceText; } sheet = sheet?.back && SHEETS[sheet.back.name](sheet.back.id) ? sheet.back : null; draft = null; render(); }
function refresh() { if (sheet) rerenderSheet(); else render(); }
function rerenderSheet() { const y = $app.querySelector('.sheet')?.scrollTop || 0; sheet.y = y; render(); sheet.y = 0; }
function afterSave(msg, go) { save(); toast(msg); if (go) { sheet = go; draft = null; } else closeSheet(); render(); }

function mountChange() {
  const el = $app.querySelector('#pad2'); if (!el) return;
  mountPattern(el, async (seq, pad) => {
    const err = $app.querySelector('#perr'), lab = $app.querySelector('#pstep');
    if (demoMode) { err.textContent = 'במצב הדגמה אין נעילה.'; pad.flash('bad'); return; }
    if (chg.step === 'current') {
      pad.hold('wait'); err.textContent = 'בודק…';
      try { await open(patKey(seq), store.get(VAULT)); chg.step = 'new'; pad.flash('good', 350); lab.textContent = 'צייר תבנית חדשה'; err.textContent = ''; }
      catch { pad.flash('bad'); err.textContent = 'זו לא התבנית הנוכחית.'; }
      return;
    }
    if (seq.length < 5) { pad.flash('bad'); err.textContent = `חיברת ${seq.length} נקודות. צריך לפחות 5.`; return; }
    if (chg.step === 'new') { chg.first = seq.join('-'); chg.step = 'confirm'; pad.flash('good', 350); lab.textContent = 'צייר שוב את התבנית החדשה'; err.textContent = ''; return; }
    if (seq.join('-') !== chg.first) { chg = { step: 'new', first: null }; pad.flash('bad'); lab.textContent = 'צייר תבנית חדשה'; err.textContent = 'התבניות לא זהות. מתחילים מחדש.'; return; }
    pad.hold('good'); err.textContent = 'מצפין מחדש…';
    SALT = crypto.getRandomValues(new Uint8Array(16)); KITER = ITER; MODE = 'pattern'; KEY = await derive(patKey(seq), SALT, KITER); save(); await saving;
    toast('תבנית הנעילה עודכנה'); closeSheet();
  });
}

    case 'dupQuote': { const q = JSON.parse(JSON.stringify(Q())); Object.assign(q, { id: uid(), no: nextQuoteNo(), date: today(), status: 'draft', sentDate: '', docUrl: '' }); db.quotes.push(q); wiz = 4; afterSave(`נוצרה הצעה ${q.no}`, { name: 'quoteForm', id: q.id }); break; }

    case 'catDel': { const c = t.dataset.c, n = db.prices.filter((p) => p.cat === c).length; ask('מחיקת קטגוריה', n ? `הקטגוריה ו־${n} הפריטים שבה יימחקו. הצעות קיימות לא משתנות.` : 'הקטגוריה תימחק.', 'מחיקה', 'bad', () => { db.priceCats = db.priceCats.filter((x) => x !== c); db.prices = db.prices.filter((p) => p.cat !== c); save(); closeSheet(); toast('הקטגוריה נמחקה'); }); break; }

    case 'pdfShare': {

    case 'schedSave': {

      if (!date) { toast('צריך לבחור תאריך'); $app.querySelector(`#sd-${id}`)?.focus(); break; }

      save();

    case 'schedIcs': {

      const id = draft._for === 'new' ? '' : draft._for;
      const name = ensureClient(draft.client, draft._phone);
      const c = client(name); if (c && draft._phone && c.phone !== draft._phone) c.phone = draft._phone;
      const q = id ? db.quotes.find((x) => x.id === id) : { id: uid() };
      const { _for, _phone, areas, ...clean } = draft;
      Object.assign(q, clean, { id: q.id, no: num(draft.no), client: name });
      q.items = q.items.filter((it) => draft.areas.includes(it.area || 'כללי'));
      if (q.status === 'sent' && !q.sentDate) q.sentDate = today();
      if (!id) db.quotes.push(q);
      if (q.no > num(S().lastQuote)) S().lastQuote = q.no;
      if (t.dataset.then === 'copy') copy(quoteText(q));
      afterSave(id ? 'ההצעה עודכנה' : `הצעה ${q.no} נשמרה`, { name: 'quote', id: q.id, back: null }); break;
    }
    case 'exportFile': case 'exportText': {
      if (demoMode) { toast('במצב הדגמה אין מה לגבות'); break; }
      const bpw = $app.querySelector('#f-bpw').value, berr = $app.querySelector('#berr');
      if (bpw.length < 8) { berr.textContent = 'סיסמת הגיבוי צריכה לפחות 8 תווים.'; break; }
      berr.textContent = 'מצפין…'; S().backupAt = today();
      const bsalt = crypto.getRandomValues(new Uint8Array(16));
      const blob = await seal(await derive(bpw, bsalt, ITER), bsalt, db, 'backup', ITER); berr.textContent = '';
      const name = `gp-backup-${today()}.json`;
      if (a === 'exportFile') {
        try { const url = URL.createObjectURL(new Blob([blob], { type: 'application/json' })); const l = document.createElement('a'); l.href = url; l.download = name; document.body.append(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); } catch {}
        const out = $app.querySelector('#backupOut'); out.hidden = false; out.value = blob;
      } else { const ok = await copy(blob); if (!ok) { const out = $app.querySelector('#backupOut'); out.hidden = false; out.value = blob; out.select(); } }

    }

      const err = $app.querySelector('#rerr'), f = $app.querySelector('#f-file').files[0];

      try {
        const r = await open(pw, text);
        ask('שחזור מגיבוי', 'כל הנתונים במכשיר יוחלפו בנתוני הגיבוי. התבנית הנוכחית נשארת.', 'שחזור', 'pri', () => { db = r.data; save(); sheet = null; tab = 'home'; render(); toast('הנתונים שוחזרו'); });
      } catch { err.textContent = 'לא הצלחתי לפתוח את הגיבוי. בדוק את הסיסמה ואת הטקסט.'; }
      break;
    }
    case 'exportCsv': {

});
function syncDraft() {
  if (!draft) return;
  $app.querySelectorAll('.sheet [data-k]').forEach((el) => { draft[el.dataset.k] = el.value; });
  $app.querySelectorAll('.sheet [data-qty]').forEach((inp) => { const it = draft.items[Number(inp.dataset.qty)]; if (!it) return; it.qty = num(inp.value) || 1; const pr = it.pid && db.prices.find((x) => x.id === it.pid); if (pr && hasP(pr.min)) it.price = unitPrice(pr, it.qty); });
}
$app.addEventListener('change', (e) => {
  if (e.target.id === 'v-file') { const f = e.target.files && e.target.files[0]; e.target.value = ''; importFile(f); return; }
  const pick = e.target.closest('select[data-pick]');
  if (pick && pick.value) {
    syncDraft(); const p = db.prices.find((x) => x.id === pick.value), ai = Number(pick.dataset.pick);
    draft.items.push({ area: draft.areas[ai], name: p.name, qty: 1, unit: p.unit, price: unitPrice(p, 1), pid: p.id });
    rerenderSheet();
  }
});
$app.addEventListener('input', (e) => {
  if (e.target.id === 'pl-q') { plQuery = e.target.value; const pos = e.target.selectionStart; refresh(); const el = $app.querySelector('#pl-q'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} } return; }
  if (e.target.id !== 'w-total' || !draft) return;
  draft.total = e.target.value; const price = qSub(draft), vat = price * vatRate();
  const v = $app.querySelector('#w-vat'), g = $app.querySelector('#w-gross');
  if (v) v.innerHTML = ils(vat); if (g) g.innerHTML = ils(price + vat);
});
$app.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const m = e.target.id && e.target.id.match(/^nl-(\d+)$/);
  if (m) { e.preventDefault(); $app.querySelector(`[data-act="addLine"][data-a="${m[1]}"]`)?.click(); }
  else if (e.target.id === 'w-newarea') { e.preventDefault(); $app.querySelector('#w-newarea').nextElementSibling?.click(); }
});
$app.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, v = formData(f), id = f.dataset.id;
  switch (f.id) {
    case 'unlock': return onUnlock(e);
    case 'payForm': { const d = db.debts.find((x) => x.id === sheet.id); if (num(v.amount) <= 0) return toast('הסכום צריך להיות גדול מאפס'); d.payments.push({ date: v.date, amount: num(v.amount) }); save(); rerenderSheet(); toast(dState(d) === 'paid' ? 'החוב סגור' : `נשארה יתרה של ${ilsTxt(dBal(d))} ₪`); break; }
    case 'debtForm': {
      const name = ensureClient(v.client, v.phone);
      const d = id ? db.debts.find((x) => x.id === id) : { id: uid(), payments: [] };
      Object.assign(d, { client: name, for: v.for, amount: num(v.amount), no: v.no, date: v.date, terms: v.terms === '' ? S().terms : num(v.terms), notes: v.notes });
      if (!id) db.debts.push(d);
      afterSave(id ? 'החוב עודכן' : 'החוב נרשם', { name: 'debt', id: d.id, back: null }); break;
    }
    case 'jobForm': {
      const name = ensureClient(v.client);
      const j = id ? db.jobs.find((x) => x.id === id) : { id: uid(), no: nextJobNo(), billed: false };
      Object.assign(j, { client: name, location: v.location, amount: num(v.amount), status: v.status, start: v.start, end: v.end, notes: v.notes });
      if (!id) db.jobs.push(j);
      afterSave(id ? 'העבודה עודכנה' : 'העבודה נרשמה', { name: 'job', id: j.id, back: null }); break;
    }
    case 'clientForm': {
      const name = v.name.trim(); if (!name) return;
      const c = id ? db.clients.find((x) => x.id === id) : { id: uid() };
      if (db.clients.some((x) => x.name === name && x.id !== c.id)) return toast('כבר יש לקוח בשם הזה');
      const old = c.name;
      Object.assign(c, { name, phone: v.phone, address: v.address, email: v.email, notes: v.notes });
      if (old && old !== name) [db.debts, db.quotes, db.jobs].forEach((arr) => arr.forEach((x) => { if (x.client === old) x.client = name; }));
      if (!id) db.clients.push(c);
      afterSave('הלקוח נשמר', { name: 'client', id: c.id, back: null }); break;

    case 'priceItemForm': {
      const val = (x) => (x === '' || x == null ? '' : num(x));
      let min = val(v.min), max = val(v.max), bmin = val(v.bmin), bmax = val(v.bmax);
      if (min === '' && max !== '') { min = max; } if (max === '' && min !== '') max = min;
      if (bmin === '' && bmax !== '') { bmin = bmax; } if (bmax === '' && bmin !== '') bmax = bmin;
      if (min !== '' && max < min) [min, max] = [max, min];
      if (bmin !== '' && bmax < bmin) [bmin, bmax] = [bmax, bmin];
      const rec = { cat: v.cat, sub: (v.sub || '').trim(), name: v.name.trim(), unit: v.unit.trim() || 'יחידה', min, max, bmin, bmax, ok: !!v.ok, note: v.note.trim() };
      if (!rec.name) return toast('צריך שם לפריט');
      if (id) Object.assign(db.prices.find((x) => x.id === id), rec); else db.prices.push({ id: uid(), ...rec });
      plClosed.delete(rec.cat); savePlClosed(); save(); toast(id ? 'הפריט עודכן' : 'הפריט נוסף'); closeSheet(); break;
    }
    case 'priceCatForm': {
      const name = v.name.trim(); if (!name) return;
      if (db.priceCats.includes(name) && name !== id) return toast('כבר יש קטגוריה בשם הזה');
      if (id) { db.priceCats[db.priceCats.indexOf(id)] = name; db.prices.forEach((p) => { if (p.cat === id) p.cat = name; }); if (plClosed.delete(id)) { plClosed.add(name); savePlClosed(); } }
      else db.priceCats.push(name);
      save(); toast(id ? 'השם עודכן' : 'הקטגוריה נוספה'); closeSheet(); break;
    }
    case 'settingsForm': Object.assign(S(), { vat: num(v.vat), validity: num(v.validity), terms: num(v.terms), follow: num(v.follow), lastQuote: num(v.lastQuote) }); afterSave('ההגדרות נשמרו'); break;
  }
});

/* ---------- swipe between pages, like the Android home screen ----------
   finger to the right = next page (the one to the left in the bottom bar), finger to the left = previous */
const TABS = ['home', 'debts', 'quotes', 'prices', 'jobs', 'more'];
const reduceMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; } };
let sw = null;
function goTab(dir, fromX = 0) {
  const i = TABS.indexOf(tab) + dir;
  const main = $app.querySelector('main');
  if (i < 0 || i >= TABS.length) { if (main) { main.style.transition = 'transform .2s ease-out'; main.style.transform = ''; } return; }
  const w = innerWidth, out = dir > 0 ? w : -w;
  const swap = () => {
    tab = TABS[i]; render(); scrollTo(0, 0);
    const m = $app.querySelector('main'); if (!m || reduceMotion()) return;
    m.style.transition = 'none'; m.style.transform = `translateX(${-out * 0.35}px)`; m.style.opacity = '0.4';
    requestAnimationFrame(() => requestAnimationFrame(() => { m.style.transition = 'transform .22s ease-out, opacity .22s ease-out'; m.style.transform = ''; m.style.opacity = ''; }));
  };
  if (!main || reduceMotion()) return swap();
  main.style.transition = 'transform .16s ease-in, opacity .16s ease-in'; main.style.transform = `translateX(${out}px)`; main.style.opacity = '0';
  setTimeout(swap, 150);
}
const noSwipe = (el) => !!el.closest('input, textarea, select, .filters, .pattern, .sheet, .scrim, .nav');
addEventListener('touchstart', (e) => {
  if (!db || sheet || e.touches.length !== 1 || noSwipe(e.target)) { sw = null; return; }
  const t = e.touches[0]; sw = { x: t.clientX, y: t.clientY, t: Date.now(), dir: 0 };
}, { passive: true });
addEventListener('touchmove', (e) => {
  if (!sw) return;
  const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (!sw.dir) { if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.4) sw.dir = 1; else if (Math.abs(dy) > 12) { sw = null; return; } else return; }
  e.preventDefault();
  const main = $app.querySelector('main'); if (!main) return;
  const i = TABS.indexOf(tab) + (dx > 0 ? 1 : -1), edge = i < 0 || i >= TABS.length;
  main.style.transition = 'none'; main.style.transform = `translateX(${edge ? dx * 0.2 : dx * 0.85}px)`;
  sw.dx = dx;
}, { passive: false });
addEventListener('touchend', () => {
  if (!sw || !sw.dir) { sw = null; return; }
  const dx = sw.dx || 0, fast = Math.abs(dx) / Math.max(1, Date.now() - sw.t) > 0.45; sw = null;
  if (Math.abs(dx) > innerWidth * 0.25 || (fast && Math.abs(dx) > 40)) goTab(dx > 0 ? 1 : -1, dx);
  else { const main = $app.querySelector('main'); if (main) { main.style.transition = 'transform .2s ease-out'; main.style.transform = ''; } }
}, { passive: true });
addEventListener('touchcancel', () => { if (sw) { const m = $app.querySelector('main'); if (m) { m.style.transition = 'transform .2s'; m.style.transform = ''; } } sw = null; }, { passive: true });

/* ---------- auto lock ---------- */
let idle, hiddenAt = 0;
const IDLE_MS = 5 * 60 * 1000;
const bump = () => { clearTimeout(idle); if (db) idle = setTimeout(() => db && lock(), IDLE_MS); };
['pointerdown', 'keydown', 'scroll'].forEach((ev) => addEventListener(ev, bump, { passive: true }));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (db && hiddenAt && Date.now() - hiddenAt > 2 * 60 * 1000) lock();
});
addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.querySelector('.scrim')) document.querySelector('.scrim').remove(); else if (e.key === 'Escape' && sheet) closeSheet(); });

renderLock();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
